services:
  postgres:
    image: postgres:16-alpine
    container_name: lgw-postgres
    environment:
      POSTGRES_USER: ${LGW_POSTGRES_USER:-lgw}
      POSTGRES_PASSWORD: ${LGW_POSTGRES_PASSWORD:-lgwpass}
      POSTGRES_DB: ${LGW_POSTGRES_DB:-lgw}
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LGW_POSTGRES_USER:-lgw} -d ${LGW_POSTGRES_DB:-lgw}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  nats:
    image: nats:2.10-alpine
    container_name: lgw-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: lgw-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: lgw-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    depends_on:
      - edge

  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: control
    container_name: lgw-control
    environment:
      LGW_SERVICE_NAME: control
      LGW_HOST: "0.0.0.0"
      LGW_HTTP_PORT: 8790
      LGW_GRPC_PORT: 9102
      LGW_DATABASE_DRIVER: postgres
      LGW_DATABASE_DSN: "postgres://${LGW_POSTGRES_USER:-lgw}:${LGW_POSTGRES_PASSWORD:-lgwpass}@postgres:5432/lgw_control?sslmode=disable"
      LGW_NATS_URL: "nats://nats:4222"
      LGW_ADMIN_TOKEN: "${LGW_ADMIN_TOKEN:?LGW_ADMIN_TOKEN is required}"
      LGW_KEY_PEPPER: "${LGW_KEY_PEPPER:?LGW_KEY_PEPPER is required}"
      LGW_OTEL_ENDPOINT: "http://jaeger:4318"
      LGW_LOG_LEVEL: "info"
    ports:
      - "8790:8790"
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8790/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  budget:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: budget
    container_name: lgw-budget
    environment:
      LGW_SERVICE_NAME: budget
      LGW_HOST: "0.0.0.0"
      LGW_HTTP_PORT: 8792
      LGW_GRPC_PORT: 9101
      LGW_DATABASE_DRIVER: postgres
      LGW_DATABASE_DSN: "postgres://${LGW_POSTGRES_USER:-lgw}:${LGW_POSTGRES_PASSWORD:-lgwpass}@postgres:5432/lgw_budget?sslmode=disable"
      LGW_NATS_URL: "nats://nats:4222"
      LGW_ADMIN_TOKEN: "${LGW_ADMIN_TOKEN:?LGW_ADMIN_TOKEN is required}"
      LGW_OTEL_ENDPOINT: "http://jaeger:4318"
      LGW_LOG_LEVEL: "info"
    ports:
      - "8792:8792"
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8792/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  usage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: usage
    container_name: lgw-usage
    environment:
      LGW_SERVICE_NAME: usage
      LGW_HOST: "0.0.0.0"
      LGW_HTTP_PORT: 8791
      LGW_DATABASE_DRIVER: postgres
      LGW_DATABASE_DSN: "postgres://${LGW_POSTGRES_USER:-lgw}:${LGW_POSTGRES_PASSWORD:-lgwpass}@postgres:5432/lgw_usage?sslmode=disable"
      LGW_NATS_URL: "nats://nats:4222"
      LGW_ADMIN_TOKEN: "${LGW_ADMIN_TOKEN:?LGW_ADMIN_TOKEN is required}"
      LGW_OTEL_ENDPOINT: "http://jaeger:4318"
      LGW_LOG_LEVEL: "info"
    ports:
      - "8791:8791"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8791/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: gateway
    container_name: lgw-gateway
    environment:
      LGW_SERVICE_NAME: gateway
      LGW_HOST: "0.0.0.0"
      LGW_HTTP_PORT: 8788
      LGW_CONTROL_ADDR: "control:9102"
      LGW_BUDGET_ADDR: "budget:9101"
      LGW_NATS_URL: "nats://nats:4222"
      LGW_KEY_PEPPER: "${LGW_KEY_PEPPER:?LGW_KEY_PEPPER is required}"
      LGW_OPENAI_API_KEY: "${LGW_OPENAI_API_KEY:-}"
      LGW_ANTHROPIC_API_KEY: "${LGW_ANTHROPIC_API_KEY:-}"
      LGW_GEMINI_API_KEY: "${LGW_GEMINI_API_KEY:-}"
      LGW_OTEL_ENDPOINT: "http://jaeger:4318"
      LGW_LOG_LEVEL: "info"
    ports:
      - "8788:8788"
    depends_on:
      control:
        condition: service_healthy
      budget:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: edge
    container_name: lgw-edge
    environment:
      LGW_SERVICE_NAME: edge
      LGW_HOST: "0.0.0.0"
      LGW_HTTP_PORT: 8787
      LGW_GATEWAY_URL: "http://gateway:8788"
      LGW_CONTROL_URL: "http://control:8790"
      LGW_USAGE_URL: "http://usage:8791"
      LGW_BUDGET_URL: "http://budget:8792"
      LGW_OTEL_ENDPOINT: "http://jaeger:4318"
      LGW_LOG_LEVEL: "info"
    ports:
      - "8787:8787"
    depends_on:
      gateway:
        condition: service_healthy
      control:
        condition: service_healthy
      usage:
        condition: service_healthy
      budget:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  pgdata:
