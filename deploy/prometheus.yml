global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "edge"
    static_configs:
      - targets: ["edge:8787"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8788"]

  - job_name: "control"
    static_configs:
      - targets: ["control:8790"]

  - job_name: "usage"
    static_configs:
      - targets: ["usage:8791"]

  - job_name: "budget"
    static_configs:
      - targets: ["budget:8792"]
