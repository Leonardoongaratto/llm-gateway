name: CI

on:
  push:
    branches:
      - main
      - 'etapa/**'
  pull_request:
    branches:
      - main

jobs:
  format:
    name: Code Formatting (gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Verify formatting
        run: |
          UNFORMATTED=$(gofmt -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml

  buf:
    name: Protobuf & Buf Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install protoc-gen-go & protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        uses: bufbuild/buf-lint-action@v1

      - name: Check gen/ is up to date
        run: |
          buf generate
          git diff --exit-code gen/
          test -z "$(git status --porcelain gen/)"

      - name: Check if main branch has protobuf definitions
        id: check_main_proto
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if [ -n "$(git ls-tree origin/main proto/)" ]; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buf Breaking Change Detection
        uses: bufbuild/buf-breaking-action@v1
        if: github.event_name == 'pull_request' && steps.check_main_proto.outputs.has_proto == 'true'
        with:
          against: 'https://github.com/Leonardoongaratto/llm-gateway.git#branch=main'

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

  test:
    name: Tests & Coverage (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install protoc-gen-go & protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Run Tests with Race Detector and Coverage
        env:
          LGW_TEST_PG_DSN: "postgres://postgres:postgres@localhost:5432/llm_gateway_test?sslmode=disable"
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/coverage.ps1 -Race -Threshold 80
